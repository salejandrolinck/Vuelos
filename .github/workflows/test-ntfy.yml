name: Test ntfy

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          topic = os.environ.get("NTFY_TOPIC")
          base_url = os.environ.get("NTFY_URL", "https://ntfy.sh").rstrip("/")
          token = os.environ.get("NTFY_TOKEN")

          if not topic:
              raise SystemExit("Falta el secret NTFY_TOPIC")

          req = urllib.request.Request(
              f"{base_url}/{topic}",
              data=b"Prueba exitosa desde GitHub Actions para el monitor de vuelos.",
              method="POST",
              headers={
                  "Title": "Prueba ntfy",
                  "Priority": "default",
                  "Tags": "white_check_mark,bell",
              },
          )
          if token:
              req.add_header("Authorization", f"Bearer {token}")

          with urllib.request.urlopen(req, timeout=30) as response:
              print(f"ntfy status: {response.status}")
          PY
