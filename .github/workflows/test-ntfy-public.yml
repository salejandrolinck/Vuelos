name: Test ntfy public

on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy public test notification
        run: |
          python - <<'PY'
          import urllib.request

          req = urllib.request.Request(
              "https://ntfy.sh/vuelos-bue-mad",
              data=b"Prueba publica desde GitHub Actions para el monitor de vuelos.",
              method="POST",
              headers={
                  "Title": "Prueba ntfy publica",
                  "Priority": "default",
                  "Tags": "white_check_mark,bell",
              },
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print(f"ntfy status: {response.status}")
          PY
